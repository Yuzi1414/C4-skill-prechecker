# ============================================================
# 交付物预检器 · 挑战注册表（数据驱动）
# 新增/修改挑战：直接在下面加一条记录即可，无需改任何代码。
# 语法约定（本技能自带极简 YAML 解析器，请遵循）：
#   · 字符串一律用双引号 "" 包裹（含中文/含空格）
#   · 列表用 ["a", "b"]；对象用 {"key": "value"}
#   · 布尔用 true / false；缩进统一 2 空格
#   · core: true = 核心交付物（缺失触发 missing_artifacts 红线）
# ============================================================

challenges:
